<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ByStay — Бронируйте жильё по всей Беларуси</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    color: #1a1a1a;
}

header {
    background: #0071C2;
    color: white;
    text-align: center;
    padding: 50px 20px;
}

header h1 {
    font-size: 52px;
}

header p {
    margin-top: 10px;
    font-size: 20px;
}

.search-container {
    max-width: 1200px;
    margin: -25px auto 50px;
    padding: 0 15px;
}

.search-box {
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.15);
}

.search-box input {
    width: 100%;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
}

.section {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.section h2 {
    margin-bottom: 20px;
}

.cities {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(170px,1fr));
    gap: 15px;
}

.city {
    background: white;
    padding: 20px;
    text-align: center;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
    font-weight: bold;
}

.hotels {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(320px,1fr));
    gap: 20px;
}

.hotel-card {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,.12);
    transition: .3s;
}

.hotel-card:hover {
    transform: translateY(-5px);
}

.hotel-card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
}

.hotel-content {
    padding: 15px;
}

.hotel-content h3 {
    margin-bottom: 8px;
}

.rating {
    color: #0071C2;
    font-weight: bold;
    margin: 8px 0;
}

.price {
    color: #00A650;
    font-size: 22px;
    font-weight: bold;
    margin-top: 10px;
}

.btn {
    display: inline-block;
    margin-top: 15px;
    background: #0071C2;
    color: white;
    text-decoration: none;
    padding: 10px 15px;
    border-radius: 8px;
}

.btn:hover {
    background: #005fa3;
}

.empty {
    background: white;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    font-size: 18px;
}

footer {
    margin-top: 50px;
    background: #0071C2;
    color: white;
    text-align: center;
    padding: 20px;
}

</style>
</head>
<body>

<header>
    <h1>🏠 ByStay</h1>
    <p>Бронируйте жильё по всей Беларуси</p>
</header>

<div class="search-container">
    <div class="search-box">

        <input
            type="text"
            id="citySearch"
            placeholder="Введите город или название объекта..."
        >

    </div>
</div>

<section class="section">

    <h2>Популярные города</h2>

    <div class="cities">
        <div class="city">🏙 Минск</div>
        <div class="city">🏰 Брест</div>
        <div class="city">🏛 Гродно</div>
        <div class="city">🎭 Витебск</div>
        <div class="city">🌳 Гомель</div>
        <div class="city">🏞 Браслав</div>
    </div>

</section>

<section class="section">

    <h2>Доступное жильё</h2>

    <div id="hotels" class="hotels"></div>

</section>

<footer>
    © 2026 ByStay • Бронируйте жильё по всей Беларуси
</footer>

<script>

const hotels = [

{
title:"Отель Минск Центр",
city:"Минск",
rating:"9.1",
price:120,
image:"https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1200&q=80"
},

{
title:"Апартаменты Немига",
city:"Минск",
rating:"8.8",
price:95,
image:"https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=1200&q=80"
},

{
title:"Отель Брест",
city:"Брест",
rating:"9.0",
price:110,
image:"https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?auto=format&fit=crop&w=1200&q=80"
},

{
title:"Гродно Лофт",
city:"Гродно",
rating:"8.9",
price:85,
image:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=1200&q=80"
},

{
title:"Усадьба Браслав",
city:"Браслав",
rating:"9.5",
price:180,
image:"https://images.unsplash.com/photo-1578683010236-d716f9a3f461?auto=format&fit=crop&w=1200&q=80"
}

];

const hotelsContainer = document.getElementById("hotels");
const searchInput = document.getElementById("citySearch");

function renderHotels(data) {

    if(data.length === 0){

        hotelsContainer.innerHTML = `
            <div class="empty">
                Ничего не найдено 😔
            </div>
        `;

        return;
    }

    hotelsContainer.innerHTML = "";

    data.forEach(hotel => {

        hotelsContainer.innerHTML += `

        <div class="hotel-card">

            <img src="${hotel.image}" alt="${hotel.title}">

            <div class="hotel-content">

                <h3>${hotel.title}</h3>

                <p>📍 ${hotel.city}</p>

                <div class="rating">
                    ⭐ ${hotel.rating}
                </div>

                <div class="price">
                    ${hotel.price} BYN / ночь
                </div>

                <a href="#" class="btn">
                    Подробнее
                </a>

            </div>

        </div>

        `;
    });
}

renderHotels(hotels);

searchInput.addEventListener("input", function(){

    const value = this.value.toLowerCase().trim();

    const filtered = hotels.filter(hotel =>

        hotel.city.toLowerCase().includes(value) ||
        hotel.title.toLowerCase().includes(value)

    );

    renderHotels(filtered);

});

</script>

</body>
</html>
